<!DOCTYPE html>
<html lang="ko"
      x-data="{ dark: localStorage.getItem('theme') !== 'light' }"
      :class="{ 'dark': dark }"
      x-init="$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'))">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        /* 다크모드 클래스를 렌더 전에 붙인다 — Alpine 은 defer 라 초기화가 늦어,
           페이지를 이동할 때마다 흰 화면이 한 번 번쩍인다 */
        if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <title>{% block title %}등하원차량등록{% endblock %}</title>
    <!-- 로컬 번들 (인터넷 없이도 UI 동작) — 정적 CSS 는 dev\build_css.bat 로 재생성 -->
    <link rel="stylesheet" href="/static/tailwind.css?v={{ static_version }}">
    <link rel="stylesheet" href="/static/ui.css?v={{ static_version }}">
    <script defer src="/static/alpine.min.js?v={{ static_version }}"></script>
    <script defer src="/static/ui.js?v={{ static_version }}"></script>
    <style>
        body { font-family: 'Malgun Gothic', -apple-system, sans-serif; }
        .log-mono { font-family: Consolas, 'D2Coding', monospace; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
    <header class="app-header">
        <h1><a href="/" class="brand"><span class="brand-mark" aria-hidden="true">↔</span>등하원차량등록</a></h1>
        <nav class="app-nav" aria-label="주 메뉴">
            {% for path, label in [('/', '메인'), ('/students', '입소자 관리'), ('/schedules', '예약 관리'), ('/settings', '설정')] %}
            <a href="{{ path }}" {% if request.url.path == path or (path == '/settings' and request.url.path.startswith('/settings/')) %}aria-current="page"{% endif %}>{{ label }}</a>
            {% endfor %}
        </nav>
        <div class="header-tools">
            <time id="header-clock" aria-label="현재 시각">--:--:--</time>
            <button @click="dark = !dark" class="theme-button" :aria-label="dark ? '라이트 모드로 전환' : '다크 모드로 전환'"
                    :title="dark ? '라이트 모드로 전환' : '다크 모드로 전환'" x-text="dark ? '☾' : '☀'"></button>
        </div>
    </header>
    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <div x-data="vehicleToasts()" x-init="connect()" class="toast-stack" role="status" aria-live="polite">
        <template x-for="t in toasts" :key="t.id">
            <div class="vehicle-toast" :class="{ departure: t.kind === '출차' }"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0 opacity-100"
                 x-transition:leave-end="translate-x-full opacity-0">
                <div>
                    <strong x-text="t.kind"></strong>
                    <p x-text="t.name ? `${t.name} · ${t.car}` : t.car"></p>
                </div>
                <button @click="dismiss(t.id)" aria-label="알림 닫기">×</button>
            </div>
        </template>
    </div>

    <script>
    function tickHeaderClock() {
        const el = document.getElementById('header-clock');
        if (!el) return;
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    tickHeaderClock();
    setInterval(tickHeaderClock, 1000);

    /* SSE 는 페이지당 딱 하나만 연다.
       브라우저는 오리진당 동시 연결을 6개로 제한하는데, 화면마다 따로 열면
       탭 몇 개만 띄워도 그 한도가 SSE 로 다 차서 페이지·API 요청이 멈춘다.
       여기서 한 번만 연결하고 수신 메시지를 커스텀 이벤트로 화면들에 나눠준다. */
    window.sseBus = (function () {
        let es = null, timer = null;
        function open() {
            if (es) return;
            es = new EventSource('/stream');
            es.onopen = () => window.dispatchEvent(new CustomEvent('connection', { detail: true }));
            es.onmessage = (e) => {
                if (e.data.startsWith(':')) return;
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }
                if (msg.type === 'data_restored' && location.pathname !== '/settings/backup') {
                    location.reload();
                    return;
                }
                window.dispatchEvent(new CustomEvent('sse', { detail: msg }));
            };
            es.onerror = () => {
                window.dispatchEvent(new CustomEvent('connection', { detail: false }));
                if (es) { es.close(); es = null; }
                clearTimeout(timer);
                timer = setTimeout(open, 3000);
            };
        }
        return {
            start: open,
            stop() {
                clearTimeout(timer);
                if (es) { es.close(); es = null; }
            },
            on(handler) {
                window.addEventListener('sse', (e) => handler(e.detail));
            },
        };
    })();

    window.showServerStopped = function () {
        window.sseBus.stop();  // 재연결 루프 방지
        document.body.innerHTML =
            '<div style="padding:3rem;text-align:center;font-family:Malgun Gothic,sans-serif">' +
            '<h2 style="font-size:1.5rem;margin-bottom:1rem">서버가 종료되었습니다.</h2>' +
            '</div>';
    };
    window.sseBus.on((msg) => {
        if (msg.type === 'server_shutdown') window.showServerStopped();
    });

    function vehicleToasts() {
        return {
            toasts: [],
            _seq: 0,
            connect() {
                window.sseBus.on((msg) => {
                    if (msg.type === 'vehicle_notify') this.push(msg.data);
                });
                window.sseBus.start();
            },
            push(data) {
                const id = ++this._seq;
                const duration = data.duration_ms || 5000;
                this.toasts.push({ id, ...data });
                setTimeout(() => this.dismiss(id), duration);
            },
            dismiss(id) {
                this.toasts = this.toasts.filter(t => t.id !== id);
            },
        };
    }
    </script>
</body>
</html>
