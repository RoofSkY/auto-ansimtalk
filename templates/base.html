<!DOCTYPE html>
<html lang="ko"
      x-data="{ dark: localStorage.getItem('theme') !== 'light' }"
      :class="{ 'dark': dark }"
      x-init="$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'))">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}등하원차량등록{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', -apple-system, sans-serif; }
        .log-mono { font-family: Consolas, 'D2Coding', monospace; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 px-6 py-3 flex items-center sticky top-0 z-10">
        <h1 class="text-xl font-bold flex-1">
            <a href="/" class="hover:text-blue-500">등하원차량등록</a>
        </h1>
        <nav class="flex gap-1 items-center">
            <a href="/students" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-sm">원생</a>
            <a href="/schedules" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-sm">예약</a>
            <a href="/settings" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-sm">설정</a>
            <button @click="dark = !dark" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-lg"
                    :title="dark ? '라이트 모드' : '다크 모드'">
                <span x-show="dark">☀️</span>
                <span x-show="!dark" x-cloak>🌙</span>
            </button>
        </nav>
    </header>
    <main class="p-4 max-w-screen-2xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <div x-data="vehicleToasts()" x-init="connect()"
         class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 items-end pointer-events-none">
        <template x-for="t in toasts" :key="t.id">
            <div class="pointer-events-auto bg-white dark:bg-gray-800 border-l-4 rounded-lg shadow-lg px-4 py-3 min-w-64 max-w-sm"
                 :class="t.kind === '입차' ? 'border-green-500' : 'border-orange-500'"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0 opacity-100"
                 x-transition:leave-end="translate-x-full opacity-0">
                <div class="flex items-start gap-3">
                    <span class="text-2xl leading-none" x-text="t.kind === '입차' ? '🚗' : '🅿️'"></span>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-sm" x-text="t.kind"></div>
                        <div class="text-sm text-gray-600 dark:text-gray-300 truncate"
                             x-text="t.name ? `${t.name} · ${t.car}` : t.car"></div>
                    </div>
                    <button @click="dismiss(t.id)"
                            class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl leading-none">×</button>
                </div>
            </div>
        </template>
    </div>

    <script>
    function vehicleToasts() {
        return {
            toasts: [],
            _seq: 0,
            connect() {
                const es = new EventSource('/stream');
                es.onmessage = (e) => {
                    if (e.data.startsWith(':')) return;
                    let msg;
                    try { msg = JSON.parse(e.data); } catch { return; }
                    if (msg.type === 'vehicle_notify') this.push(msg.data);
                };
                es.onerror = () => {
                    es.close();
                    setTimeout(() => this.connect(), 3000);
                };
            },
            push(data) {
                const id = ++this._seq;
                this.toasts.push({ id, ...data });
                setTimeout(() => this.dismiss(id), 5000);
            },
            dismiss(id) {
                this.toasts = this.toasts.filter(t => t.id !== id);
            },
        };
    }
    </script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</body>
</html>
