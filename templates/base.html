<!DOCTYPE html>
<html lang="ko"
      x-data="{ dark: localStorage.getItem('theme') !== 'light' }"
      :class="{ 'dark': dark }"
      x-init="$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'))">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}등하원차량등록{% endblock %}</title>
    <!-- 로컬 번들 (인터넷 없이도 UI 동작) — 정적 CSS 는 dev\build_css.bat 로 재생성 -->
    <!-- ?v= 버전 쿼리: 업데이트 후 브라우저가 구버전 CSS 캐시를 계속 쓰지 않도록 -->
    <link rel="stylesheet" href="/static/tailwind.css?v={{ app_version }}">
    <script defer src="/static/alpine.min.js?v={{ app_version }}"></script>
    <style>
        body { font-family: 'Malgun Gothic', -apple-system, sans-serif; }
        .log-mono { font-family: Consolas, 'D2Coding', monospace; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">
    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 px-6 py-3 flex items-center sticky top-0 z-10 relative">
        <h1 class="text-xl font-bold">
            <a href="/" class="hover:text-blue-500">등하원차량등록</a>
        </h1>

        <div id="header-clock"
             class="absolute left-1/2 -translate-x-1/2 text-2xl font-bold tabular-nums tracking-wider">
            --:--:--
        </div>

        <div class="flex-1"></div>

        <nav class="flex gap-3 items-center">
            <a href="/settings" title="설정"
               class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded text-xl leading-none">⚙️</a>
            <button @click="dark = !dark" role="switch" :aria-checked="dark"
                    :title="dark ? '라이트 모드로 전환' : '다크 모드로 전환'"
                    class="relative inline-flex h-7 w-14 items-center rounded-full transition-colors"
                    :class="dark ? 'bg-blue-600' : 'bg-gray-300'">
                <span class="inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform text-sm leading-6 text-center"
                      :class="dark ? 'translate-x-7' : 'translate-x-1'"
                      x-text="dark ? '🌙' : '☀️'"></span>
            </button>
        </nav>
    </header>
    <main class="p-4 max-w-screen-2xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <!-- 입출차 토스트 (전역 — 모든 페이지에서 표시) -->
    <div x-data="vehicleToasts()" x-init="connect()"
         class="fixed bottom-6 right-6 z-50 flex flex-col gap-4 items-end pointer-events-none">
        <template x-for="t in toasts" :key="t.id">
            <div class="pointer-events-auto bg-white dark:bg-gray-800 border-l-8 rounded-2xl shadow-2xl px-8 py-6 min-w-[28rem] max-w-2xl"
                 :class="t.kind === '입차' ? 'border-green-500' : 'border-orange-500'"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0 opacity-100"
                 x-transition:leave-end="translate-x-full opacity-0">
                <div class="flex items-start gap-5">
                    <span class="text-5xl leading-none" x-text="t.kind === '입차' ? '🚗' : '🅿️'"></span>
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-2xl" x-text="t.kind"></div>
                        <div class="text-xl text-gray-600 dark:text-gray-300 truncate mt-1"
                             x-text="t.name ? `${t.name} · ${t.car}` : t.car"></div>
                    </div>
                    <button @click="dismiss(t.id)"
                            class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-4xl leading-none">×</button>
                </div>
            </div>
        </template>
    </div>

    <script>
    function tickHeaderClock() {
        const el = document.getElementById('header-clock');
        if (!el) return;
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        el.textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }
    tickHeaderClock();
    setInterval(tickHeaderClock, 1000);

    function vehicleToasts() {
        return {
            toasts: [],
            _seq: 0,
            connect() {
                const es = new EventSource('/stream');
                es.onmessage = (e) => {
                    if (e.data.startsWith(':')) return;
                    let msg;
                    try { msg = JSON.parse(e.data); } catch { return; }
                    if (msg.type === 'vehicle_notify') this.push(msg.data);
                };
                es.onerror = () => {
                    es.close();
                    setTimeout(() => this.connect(), 3000);
                };
            },
            push(data) {
                const id = ++this._seq;
                const duration = data.duration_ms || 5000;
                this.toasts.push({ id, ...data });
                setTimeout(() => this.dismiss(id), duration);
            },
            dismiss(id) {
                this.toasts = this.toasts.filter(t => t.id !== id);
            },
        };
    }
    </script>
</body>
</html>
