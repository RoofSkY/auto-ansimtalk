{% extends "base.html" %}
{% block title %}설정{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-bold mb-4">설정</h2>

    <form action="/api/settings" method="post" class="space-y-4">
        <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" name="auto_search" {% if config.auto_search %}checked{% endif %} class="w-4 h-4">
            <span>원생 차량 자동검색</span>
        </label>

        <div>
            <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1">갱신 주기 (초, 최소 5)</label>
            <input name="auto_search_interval" type="number"
                   value="{{ config.auto_search_interval }}" min="5"
                   class="px-3 py-1.5 border rounded dark:bg-gray-700 dark:border-gray-600 w-32">
        </div>

        <button class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded">저장</button>
    </form>

    <div class="mt-8 pt-4 border-t dark:border-gray-700 text-sm">
        <h3 class="font-semibold mb-2">관리 페이지</h3>
        <div class="flex gap-3">
            <a href="/students" class="text-blue-500 hover:underline">원생 관리</a>
            <span class="text-gray-300 dark:text-gray-600">·</span>
            <a href="/schedules" class="text-blue-500 hover:underline">예약 관리</a>
        </div>
    </div>

    <div class="mt-6 pt-4 border-t dark:border-gray-700">
        <h3 class="font-semibold mb-2 text-sm">서버</h3>
        <button onclick="shutdownServer()"
                class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded text-sm">
            서버 종료
        </button>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
            종료 시 자동 입출차 감지와 예약 실행도 모두 멈춥니다.
        </p>
    </div>
</div>

<script>
async function shutdownServer() {
    if (!confirm('서버를 종료할까요? 자동 입출차 감지와 예약이 모두 멈춥니다.')) return;
    try { await fetch('/api/shutdown', { method: 'POST' }); } catch (e) {}
    setTimeout(() => {
        document.body.innerHTML =
            '<div style="padding:3rem;text-align:center;font-family:Malgun Gothic,sans-serif">' +
            '<h2 style="font-size:1.5rem;margin-bottom:1rem">서버가 종료되었습니다.</h2>' +
            '<p style="color:#666">다시 시작하려면 [시작.bat] 을 실행하세요.</p>' +
            '</div>';
    }, 400);
}
</script>
{% endblock %}
