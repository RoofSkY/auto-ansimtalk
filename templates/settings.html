{% extends "base.html" %}
{% block title %}설정{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow p-6">
    <h2 class="text-xl font-bold mb-4">설정</h2>

    <form action="/api/settings" method="post" class="space-y-5">
        <label class="flex items-center justify-between cursor-pointer">
            <span>입출차 토스트 알림</span>
            <span class="relative inline-block h-7 w-14 shrink-0">
                <input type="checkbox" name="vehicle_toast" class="peer sr-only"
                       {% if config.vehicle_toast %}checked{% endif %}>
                <span class="absolute inset-0 rounded-full bg-gray-300 dark:bg-gray-600 peer-checked:bg-blue-600 transition-colors"></span>
                <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-7"></span>
            </span>
        </label>

        <div>
            <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1">토스트 표시 시간 (초, 최소 1)</label>
            <input name="vehicle_toast_duration" type="number"
                   value="{{ config.vehicle_toast_duration }}" min="1"
                   class="px-3 py-1.5 border rounded dark:bg-gray-700 dark:border-gray-600 w-32">
        </div>

        <div class="pt-2 border-t dark:border-gray-700"></div>

        <label class="flex items-center justify-between cursor-pointer">
            <span>원생 차량 자동검색</span>
            <span class="relative inline-block h-7 w-14 shrink-0">
                <input type="checkbox" name="auto_search" class="peer sr-only"
                       {% if config.auto_search %}checked{% endif %}>
                <span class="absolute inset-0 rounded-full bg-gray-300 dark:bg-gray-600 peer-checked:bg-blue-600 transition-colors"></span>
                <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-7"></span>
            </span>
        </label>

        <div class="pt-2 border-t dark:border-gray-700"></div>

        <label class="flex items-center justify-between cursor-pointer">
            <span>등하원 상태 동기화</span>
            <span class="relative inline-block h-7 w-14 shrink-0">
                <input type="checkbox" name="att_sync" class="peer sr-only"
                       {% if config.att_sync %}checked{% endif %}>
                <span class="absolute inset-0 rounded-full bg-gray-300 dark:bg-gray-600 peer-checked:bg-blue-600 transition-colors"></span>
                <span class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-7"></span>
            </span>
        </label>

        <div class="pt-2 border-t dark:border-gray-700"></div>

        <div>
            <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1">
                갱신 주기 (초, 최소 10) — 차량 자동검색 · 등하원 상태
            </label>
            <input name="refresh_interval" type="number"
                   value="{{ config.refresh_interval }}" min="10"
                   class="px-3 py-1.5 border rounded dark:bg-gray-700 dark:border-gray-600 w-32">
        </div>

        <button class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded">저장</button>
    </form>

    <div class="mt-8 pt-4 border-t dark:border-gray-700">
        <h3 class="font-semibold mb-3 text-sm">관리 페이지</h3>
        <div class="flex gap-3">
            <a href="/students"
               class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded text-sm">
                원생 관리
            </a>
            <a href="/schedules"
               class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded text-sm">
                차량 예약 등록 관리
            </a>
        </div>
    </div>

    <div class="mt-6 pt-4 border-t dark:border-gray-700">
        <h3 class="font-semibold mb-3 text-sm">안심톡 계정</h3>
        <form action="/api/settings/ansim" method="post" class="space-y-3">
            <div>
                <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1">아이디</label>
                <input name="user_id" value="{{ ansim_user_id }}" autocomplete="off"
                       class="px-3 py-1.5 border rounded dark:bg-gray-700 dark:border-gray-600 w-48">
            </div>
            <div>
                <label class="block text-sm text-gray-500 dark:text-gray-400 mb-1">비밀번호</label>
                <input name="password" type="password" placeholder="변경할 때만 입력" autocomplete="new-password"
                       class="px-3 py-1.5 border rounded dark:bg-gray-700 dark:border-gray-600 w-48">
            </div>
            <button class="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded text-sm">저장</button>
            <p class="text-xs text-gray-500 dark:text-gray-400">
                저장 시 기존 로그인 세션이 초기화되고 새 계정으로 즉시 동기화합니다.
            </p>
        </form>
    </div>

    <div class="mt-6 pt-4 border-t dark:border-gray-700">
        <h3 class="font-semibold mb-3 text-sm">나이스파크(주차) 세션</h3>
        <button onclick="niceparkRelogin()"
                class="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded text-sm">
            쿠키 수동 갱신
        </button>
        <span id="np-status" class="ml-2 text-xs text-gray-500 dark:text-gray-400"></span>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
            클릭하면 이 PC에 로그인 브라우저 창이 열립니다. 로그인을 마치면 쿠키가 자동 저장되고
            결과가 메인 화면 로그에 표시됩니다.
        </p>
    </div>

    <div class="mt-6 pt-4 border-t dark:border-gray-700">
        <h3 class="font-semibold mb-2 text-sm">서버</h3>
        <button onclick="shutdownServer()"
                class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded text-sm">
            서버 종료
        </button>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
            종료 시 자동 입출차 감지와 예약 실행도 모두 멈춥니다.
        </p>
    </div>
</div>

<script>
async function niceparkRelogin() {
    const status = document.getElementById('np-status');
    try {
        await fetch('/api/nicepark/relogin', { method: 'POST' });
        status.textContent = '로그인 브라우저가 열렸습니다 — 로그인 완료 시 자동 저장됩니다.';
    } catch (e) {
        status.textContent = '요청 실패: ' + e;
    }
}

async function shutdownServer() {
    if (!confirm('서버를 종료할까요? 자동 입출차 감지와 예약이 모두 멈춥니다.')) return;
    try { await fetch('/api/shutdown', { method: 'POST' }); } catch (e) {}
    setTimeout(() => {
        document.body.innerHTML =
            '<div style="padding:3rem;text-align:center;font-family:Malgun Gothic,sans-serif">' +
            '<h2 style="font-size:1.5rem;margin-bottom:1rem">서버가 종료되었습니다.</h2>' +
            '<p style="color:#666">다시 시작하려면 [start.bat] 을 실행하세요.</p>' +
            '</div>';
    }, 400);
}
</script>
{% endblock %}
