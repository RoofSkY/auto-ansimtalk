{% extends "base.html" %}
{% block content %}
<div x-data="mainApp()" class="grid grid-cols-1 lg:grid-cols-2 gap-4">

    <section class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 flex flex-col" style="height: calc(100vh - 7rem)">
        <div class="flex items-center justify-between mb-3 gap-2">
            <h2 class="font-bold text-lg whitespace-nowrap">원생 목록</h2>
            <input type="text" x-model="searchQuery" placeholder="이름 검색"
                class="flex-1 px-3 py-1 border rounded dark:bg-gray-700 dark:border-gray-600 text-sm">
            <button @click="manualRefresh($event)" title="새로고침 (다음 자동 새로고침까지 남은 초)"
                    class="px-3 py-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded text-sm whitespace-nowrap flex items-center gap-1.5 tabular-nums">
                <span>⟳</span>
                <span x-text="refreshRemaining > 0 ? refreshRemaining + '초' : '…'"></span>
            </button>
        </div>
        <div class="grid grid-cols-12 gap-2 text-xs font-bold text-gray-500 dark:text-gray-400 px-2 mb-1 border-b dark:border-gray-700 pb-1">
            <span class="col-span-2">이름</span>
            <span class="col-span-2">출결상태</span>
            <span class="col-span-2">등원</span>
            <span class="col-span-2">하원</span>
            <span class="col-span-4"></span>
        </div>
        <div class="space-y-1 overflow-y-auto flex-1">
            <template x-for="s in filteredStudents" :key="s.originalIndex">
                <div class="grid grid-cols-12 gap-2 items-center p-2 rounded text-sm transition-colors"
                     :class="isParked(s) ? 'bg-green-300 dark:bg-green-700' : 'bg-gray-50 dark:bg-gray-700/50'">
                    <span x-text="s.name" class="col-span-2 font-semibold truncate"></span>
                    <span class="col-span-2">
                        <span class="inline-block w-14 text-center py-0.5 rounded-full text-xs font-semibold border"
                              :class="badgeClass(statusOf(s))"
                              x-text="statusOf(s)"></span>
                    </span>
                    <span class="col-span-2 text-gray-600 dark:text-gray-400 truncate tabular-nums"
                          x-text="inTimeOf(s)"></span>
                    <span class="col-span-2 text-gray-600 dark:text-gray-400 truncate tabular-nums"
                          x-text="outTimeOf(s)"></span>
                    <div class="col-span-4 flex gap-1 justify-end">
                        <button @click="doAction(s.originalIndex, 'attendance', $event)"
                                class="px-2 py-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded text-xs">
                            등하원처리
                        </button>
                        <button @click="doAction(s.originalIndex, 'vehicle', $event)"
                                class="px-2 py-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded text-xs">
                            차량등록
                        </button>
                    </div>
                </div>
            </template>
            <div x-show="filteredStudents.length === 0" class="text-center text-gray-500 py-8">
                <span x-show="students.length === 0">등록된 원생이 없습니다. <a href="/students" class="text-blue-500 hover:underline">추가하기</a></span>
                <span x-show="students.length > 0 && searchQuery" x-text="`'${searchQuery}' 검색 결과 없음`"></span>
            </div>
        </div>
    </section>

    <section class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 flex flex-col" style="height: calc(100vh - 7rem)">
        <div class="flex items-center justify-between mb-3">
            <h2 class="font-bold text-lg">로그</h2>
            <button x-show="!autoScroll" @click="scrollToBottom(true)"
                    class="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded-full text-xs">
                ↓ 최신
            </button>
        </div>
        <div class="flex gap-1 mb-2 border-b dark:border-gray-700 overflow-x-auto">
            <template x-for="tab in logTabs" :key="tab.key">
                <button @click="currentTab = tab.key"
                        class="px-3 py-1.5 text-sm whitespace-nowrap"
                        :class="currentTab === tab.key ? 'border-b-2 border-blue-500 font-semibold text-blue-500' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'"
                        x-text="tab.label"></button>
            </template>
        </div>
        <div class="overflow-y-auto flex-1 log-mono text-xs leading-relaxed pr-2"
             x-ref="logBox" @scroll="onLogScroll">
            <template x-for="(log, i) in filteredLogs" :key="i">
                <div :class="log.ok ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'"
                     x-text="`[${log.time}] [${log.type}] ${log.target} - ${log.message}`"></div>
            </template>
            <div x-show="filteredLogs.length === 0" class="text-gray-500 text-center py-8">
                표시할 로그가 없습니다.
            </div>
        </div>
    </section>
</div>

<script>
// ---------- 초성 검색 ----------
const CHOSUNG = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const CHOSUNG_SET = new Set(CHOSUNG);

function chosungOf(ch) {
    if (!ch) return null;
    const code = ch.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
        return CHOSUNG[Math.floor((code - 0xAC00) / (21 * 28))];
    }
    return null;
}

function nameMatches(name, query) {
    if (!query) return true;
    if (name.length < query.length) return false;
    for (let i = 0; i < query.length; i++) {
        const q = query[i], n = name[i];
        if (CHOSUNG_SET.has(q)) {
            if (chosungOf(n) !== q) return false;
        } else {
            if (q !== n) return false;
        }
    }
    return true;
}

function mainApp() {
    return {
        students: {{ students | tojson }},
        logs: {{ logs | tojson }},
        inCars: new Set({{ in_cars | tojson }}),
        attStatus: {{ att_status | tojson }},
        attTimes: {{ att_times | tojson }},
        refreshRemaining: {{ att_refresh_remaining }},
        searchQuery: '',
        currentTab: 'all',
        autoScroll: true,
        logTabs: [
            { key: 'all', label: '전체', match: () => true },
            { key: 'ansim', label: '안심톡', match: l => ['안심톡','안심톡(예약)','등하원','등하원(예약)'].includes(l.type) },
            { key: 'park', label: '주차', match: l => ['차량등록','차량등록(예약)','입차','출차'].includes(l.type) },
            { key: 'park_reg', label: '주차등록', match: l => l.type === '차량등록' || l.type === '차량등록(예약)' },
            { key: 'inout', label: '입출차', match: l => l.type === '입차' || l.type === '출차' },
            { key: 'in', label: '입차', match: l => l.type === '입차' },
            { key: 'out', label: '출차', match: l => l.type === '출차' },
        ],

        init() {
            this.connectSSE();
            this.$nextTick(() => this.scrollToBottom(true));
            setInterval(() => {
                if (this.refreshRemaining > 0) this.refreshRemaining--;
            }, 1000);
        },

        connectSSE() {
            const es = new EventSource('/stream');
            es.onmessage = (e) => {
                if (e.data.startsWith(':')) return;
                let msg;
                try { msg = JSON.parse(e.data); } catch { return; }
                if (msg.type === 'log') {
                    this.logs.push(msg.data);
                    if (this.autoScroll) {
                        this.$nextTick(() => this.scrollToBottom(false));
                    }
                } else if (msg.type === 'in_cars') {
                    this.inCars = new Set(msg.data.cars);
                } else if (msg.type === 'att_status') {
                    this.attStatus[msg.data.key] = msg.data.status;
                    this.attTimes[msg.data.key] = {
                        in: msg.data.in_time || '',
                        out: msg.data.out_time || '',
                    };
                } else if (msg.type === 'refreshed') {
                    this.refreshRemaining = msg.data.next_in || 0;
                } else if (msg.type === 'att_reset') {
                    this.attStatus = {};
                    this.attTimes = {};
                }
            };
            es.onerror = () => {
                setTimeout(() => this.connectSSE(), 3000);
                es.close();
            };
        },

        isParked(student) {
            for (const c of (student.car_no4s || [])) {
                if (this.inCars.has(c)) return true;
            }
            return false;
        },

        keyOf(s) {
            return (s.code || '').trim() || (s.name || '').trim();
        },

        statusOf(s) {
            return this.attStatus[this.keyOf(s)] || '미등원';
        },

        badgeClass(st) {
            if (st === '등원') return 'bg-sky-300 text-sky-900 border-sky-400';
            if (st === '하원') return 'bg-yellow-200 text-yellow-900 border-yellow-300';
            if (st === '결석' || st === '공결' || st === '캠프') return 'bg-red-500 text-white border-red-600';
            return 'bg-white text-gray-500 border-gray-300 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-600';
        },

        inTimeOf(s) {
            const t = this.attTimes[this.keyOf(s)];
            return t ? (t.in || '').trim() : '';
        },

        outTimeOf(s) {
            const t = this.attTimes[this.keyOf(s)];
            return t ? (t.out || '').trim() : '';
        },

        get filteredStudents() {
            const q = this.searchQuery.trim();
            const out = [];
            this.students.forEach((s, idx) => {
                if (nameMatches(s.name || '', q)) {
                    out.push({ ...s, originalIndex: idx });
                }
            });
            return out;
        },

        get filteredLogs() {
            const tab = this.logTabs.find(t => t.key === this.currentTab);
            return tab ? this.logs.filter(tab.match) : this.logs;
        },

        scrollToBottom(force) {
            const box = this.$refs.logBox;
            if (!box) return;
            box.scrollTop = box.scrollHeight;
            if (force) this.autoScroll = true;
        },

        onLogScroll() {
            const box = this.$refs.logBox;
            if (!box) return;
            const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 5;
            this.autoScroll = atBottom;
        },

        async manualRefresh(ev) {
            const btn = ev.currentTarget;
            btn.disabled = true;
            btn.classList.add('opacity-50');
            this.refreshRemaining = 0;   // '…' 표시 — refreshed 이벤트가 오면 리셋됨
            try {
                await fetch('/api/refresh', { method: 'POST' });
            } catch (e) {}
            setTimeout(() => {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }, 800);
        },

        async doAction(idx, action, ev) {
            const btn = ev.currentTarget;
            btn.disabled = true;
            btn.classList.add('opacity-50');
            try {
                await fetch(`/api/students/${idx}/${action}`, { method: 'POST' });
                // 등하원처리만 완료 후 서버가 즉시 갱신 → refreshed 로 리셋 (차량등록은 갱신 없음)
                if (action === 'attendance') this.refreshRemaining = 0;
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }, 500);
            }
        },
    };
}
</script>
{% endblock %}
