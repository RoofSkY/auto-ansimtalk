{% extends "base.html" %} {% block content %}
<div x-data="mainApp()" @connection.window="connected = $event.detail">
	<section class="panel student-toolbar" aria-label="입소자 검색 및 필터">
		<div class="toolbar-main">
			<input
				type="search"
				x-model="searchQuery"
				placeholder="이름 또는 초성 검색"
				aria-label="입소자 이름 또는 초성 검색"
				class="search-field" />
			<button
				@click="manualRefresh($event)"
				class="btn status-end"
				title="지금 갱신">
				<svg
					width="18"
					height="18"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					aria-hidden="true">
					<path
						d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"
						stroke-linecap="round"
						stroke-linejoin="round" /></svg
				><span
					x-text="refreshRemaining > 0 ? refreshRemaining + '초' : '…'"></span>
			</button>
			<span
				class="refresh-time"
				x-text="'최근 갱신 ' + (lastRefresh || '—')"></span>
			<div class="service-states">
				<span class="service-state" title="최근 안심톡 조회 결과"
					><i
						class="status-dot"
						:class="serviceTone('ansim')"
						aria-hidden="true"></i
					><span x-text="'안심톡 ' + serviceLabel('ansim')"></span
				></span>
				<span class="service-state" title="최근 아이파킹 조회 결과"
					><i
						class="status-dot"
						:class="serviceTone('iparking')"
						aria-hidden="true"></i
					><span x-text="'아이파킹 ' + serviceLabel('iparking')"></span
				></span>
			</div>
		</div>
		<div class="filter-row" aria-label="출결 상태 필터">
			<template x-for="st in statusTabs" :key="st">
				<button
					@click="statusFilter = st; syncAtt()"
					class="filter-btn"
					:class="{ active: statusFilter === st }"
					:aria-pressed="statusFilter === st">
					<b x-text="st"></b><span x-text="statusCount(st)"></span>
				</button>
			</template>
		</div>
	</section>
	<p
		x-cloak
		x-show="actionError"
		x-text="actionError"
		role="alert"
		class="notice"></p>
	<div class="dashboard">
		<section class="student-panel" aria-label="입소자 목록">
			<div class="student-columns">
				<template x-for="group in studentGroups" :key="group.index">
					<section
						class="panel student-table"
						:aria-label="'입소자 목록 ' + (group.index + 1)">
						<div class="student-head" aria-hidden="true">
							<span>이름</span><span>출결</span><span>등원</span
							><span>하원</span><span>처리</span>
						</div>
						<template x-for="s in group.students" :key="s.id">
							<article
								class="student-row"
								:class="{ 'is-parked': isParked(s) }"
								:aria-label="s.name + (isParked(s) ? ' · 입차 중' : '')">
								<span
									class="student-name"
									:title="s.name"
									x-text="s.name"></span>
								<span class="attendance-cell"
									><span
										class="badge"
										:class="badgeClass(statusOf(s))"
										x-text="statusOf(s)"></span
								></span>
								<span
									class="time-cell time-in"
									:aria-label="'등원 시각 ' + (inTimeOf(s) || '없음')"
									x-text="inTimeOf(s) || ''"></span>
								<span
									class="time-cell time-out"
									:aria-label="'하원 시각 ' + (outTimeOf(s) || '없음')"
									x-text="outTimeOf(s) || ''"></span>
								<div class="row-actions">
									<button
										@click="doAction(s.id, 'attendance')"
										:disabled="isBusy(s, 'attendance')"
										:aria-busy="isBusy(s, 'attendance')"
										:aria-label="s.name + ' ' + actionLabel(s, 'attendance')"
										x-text="actionLabel(s, 'attendance')"
										class="btn btn-primary">
										등하원처리
									</button>
									<button
										@click="doAction(s.id, 'vehicle')"
										:disabled="isBusy(s, 'vehicle')"
										:aria-busy="isBusy(s, 'vehicle')"
										:aria-label="s.name + ' ' + actionLabel(s, 'vehicle')"
										x-text="actionLabel(s, 'vehicle')"
										class="btn btn-outline">
										주차권 등록
									</button>
								</div>
							</article>
						</template>
						<div x-cloak x-show="group.students.length === 0" class="empty-state">
							<p x-text="students.length === 0 ? '등록된 입소자가 없습니다.' : filteredStudents.length === 0 ? '조건에 맞는 입소자가 없습니다.' : '표시할 입소자가 없습니다.'"></p>
							<template x-if="group.index === 0 && filteredStudents.length === 0">
								<div>
									<a x-show="students.length === 0" href="/students">입소자 추가하기</a>
								</div>
							</template>
						</div>
					</section>
				</template>
			</div>
		</section>
		<section class="panel log-panel" aria-label="처리 기록">
			<div class="panel-heading">
				<h2>처리 기록</h2>
				<button
					x-cloak
					x-show="!autoScroll"
					@click="scrollToBottom(true)"
					class="btn">
					↓ 최신 기록
				</button>
			</div>
			<div class="log-filters" aria-label="기록 종류 필터">
				<template x-for="tab in logTabs" :key="tab.key"
					><button
						@click="selectLogTab(tab.key)"
						class="log-tab"
						:class="{ active: currentTab === tab.key }"
						:aria-pressed="currentTab === tab.key"
						x-text="tab.label"></button
				></template>
			</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="log-icon-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M5 4h14m-3-3 3 3-3 3M4 14l2-5h12l2 5v6H4zM4 14h16M6 20v2m12-2v2M7 17h1m8 0h1"/>
							</symbol><symbol id="log-icon-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M19 4H5m3-3L5 4l3 3M4 14l2-5h12l2 5v6H4zM4 14h16M6 20v2m12-2v2M7 17h1m8 0h1"/>
							</symbol><symbol id="log-icon-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M11 3h8v18h-8M3 12h12m-4-4 4 4-4 4"/>
							</symbol><symbol id="log-icon-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M11 3H3v18h8M9 12h12m-4-4 4 4-4 4"/>
							</symbol><symbol id="log-icon-4"
								class="log-success"
								viewBox="0 0 24 24"
								aria-hidden="true">
								<circle
									cx="12"
									cy="12"
									r="11"
									fill="currentColor" />
								<path
									d="m6.5 12 3.5 3.5 7.5-7"
									fill="none"
									stroke="white"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round" />
							</symbol><symbol id="log-icon-5"
								class="log-failure"
								viewBox="0 0 24 24"
								aria-hidden="true">
								<path
									d="M10.25 3.5a2 2 0 0 1 3.5 0l9 16A2 2 0 0 1 21 22H3a2 2 0 0 1-1.75-2.5z"
									fill="currentColor" />
								<path
									d="M12 8v6"
									stroke="white"
									stroke-width="2"
									stroke-linecap="round" />
								<circle cx="12" cy="18" r="1.2" fill="white" />
							</symbol></svg>
			<div class="log-list" x-ref="logBox" @scroll="onLogScroll">
                <button class="btn" x-cloak x-show="hasMoreLogs || logsLoading"
                    :disabled="logsLoading" @click="loadLogs(true)"
                    x-text="logsLoading ? '기록 불러오는 중…' : '이전 기록 500건 더 보기'"></button>
                <p class="feedback-error" x-cloak x-show="logsError" x-text="logsError"></p>
                <button class="btn" x-cloak x-show="logsError && !logsLoading"
                    @click="loadLogs(logs.length > 0)">다시 불러오기</button>
				<template x-for="log in filteredLogs" :key="log.id">
					<article class="log-entry">
						<time class="log-time" x-text="log.time"></time>
						<span
							class="log-status"
							role="img"
							:aria-label="log.icon" :title="log.icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true"
                                :class="{ 'log-success': log.iconIndex === 4, 'log-failure': log.iconIndex === 5 }">
                                <use :href="'#log-icon-' + log.iconIndex"></use>
                            </svg>
						</span>
						<div class="log-summary" :title="log.time + ' · ' + log.displayTarget + ' · ' + log.displayType + ' · ' + log.message">
							<span
								class="log-target"
								x-text="log.displayTarget"></span>
							<span aria-hidden="true"> · </span>
							<span
								class="log-message"
								:class="{ 'feedback-error': !log.ok }"
								x-text="log.displayType + ' · ' + log.message"></span>
						</div>
					</article>
				</template>
				<div
					x-cloak
					x-show="filteredLogs.length === 0"
					class="empty-state">
					표시할 기록이 없습니다.
				</div>
			</div>
			<div
				class="log-foot"
				x-text="autoScroll ? '● 새 기록 자동 따라가기' : '이전 기록을 보고 있습니다'"></div>
		</section>
	</div>
</div>

<script>
	const CHOSUNG = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
	const CHOSUNG_SET = new Set(CHOSUNG);

	function chosungOf(ch) {
	    if (!ch) return null;
	    const code = ch.charCodeAt(0);
	    if (code >= 0xAC00 && code <= 0xD7A3) {
	        return CHOSUNG[Math.floor((code - 0xAC00) / (21 * 28))];
	    }
	    return null;
	}

	function matchesAt(name, query, start) {
	    for (let i = 0; i < query.length; i++) {
	        const q = query[i], n = name[start + i];
	        if (CHOSUNG_SET.has(q)) {
	            if (chosungOf(n) !== q) return false;
	        } else {
	            if (q !== n) return false;
	        }
	    }
	    return true;
	}

	// 부분 일치 — '길동' 으로도 '홍길동' 이 검색된다 (초성 혼용 가능)
	function nameMatches(name, query) {
	    if (!query) return true;
	    if (name.length < query.length) return false;
	    for (let s = 0; s <= name.length - query.length; s++) {
	        if (matchesAt(name, query, s)) return true;
	    }
	    return false;
	}

	function mainApp() {
	    return {
	        students: {{ students | tojson }},
	        logs: {{ logs | tojson }},
            hasMoreLogs: {{ logs_has_more | default(false) | tojson }},
            logsDate: {{ logs_date | default('') | tojson }},
            logsLoading: false,
            logsError: '',
            logLimit: 500,
            logGeneration: 0,
            pendingLogs: [],
            logFrame: null,
	        inCars: new Set({{ in_cars | tojson }}),
	        attStatus: {{ att_status | tojson }},
	        attTimes: {{ att_times | tojson }},
	        refreshRemaining: {{ att_refresh_remaining }},
	        actionResources: [],
	        actionRevision: -1,
	        actionInstance: '',
	        actionsReady: false,
	        pendingActions: {},
	        actionError: '',
	        actionsSyncing: false,
	        actionTimer: null,
	        countdownTimer: null,
	        searchQuery: '',
	        connected: false,
	        serviceHealth: {{ service_status.health | tojson }},
	        lastRefresh: {{ service_status.last_refresh | tojson }},
	        currentTab: 'all',
	        statusFilter: '전체',
	        statusTabs: ['전체', '미등원', '등원', '하원', '결석', '공결', '캠프'],
	        autoScroll: true,
	        logTabs: [
	            { key: 'all', label: '전체', match: () => true },
	            { key: 'ansim', label: '안심톡', match: l => ['안심톡','안심톡(예약)','등하원','등하원(예약)'].includes(l.type) },
	            { key: 'park', label: '주차', match: l => ['차량등록','차량등록(예약)','입차','출차'].includes(l.type) },
	            { key: 'failed', label: '실패', match: l => !l.ok },
	        ],

	        init() {
	            // 보정 로그(실제 등하원 시각)가 파일에 늦게 추가돼도 표시는 시간순 유지
	            this.logs = this.logs.map(log => this.prepareLog(log)).sort((a, b) => this.compareLogs(a, b));
	            this.connectSSE();
	            this.$nextTick(() => this.scrollToBottom(true));
	            this.countdownTimer = setInterval(() => {
	                if (this.refreshRemaining > 0) this.refreshRemaining--;
	            }, 1000);
	            this.syncActions();
	            this.actionTimer = setInterval(() => {
	                if (!this.actionsReady || this.actionResources.length || Object.keys(this.pendingActions).length) {
	                    this.syncActions();
	                }
	            }, 3000);
	        },

	        destroy() {
	            clearInterval(this.actionTimer);
	            clearInterval(this.countdownTimer);
                cancelAnimationFrame(this.logFrame);
	        },

	        connectSSE() {
	            window.sseBus.on((msg) => {
	                if (msg.type === 'actions') {
	                    this.applyActions(msg.data);
	                } else if (msg.type === 'log') {
	                    // 시간순 위치에 삽입 — 과거 시각의 보정 로그가 맨 아래에 붙지 않도록
	                    this.enqueueLog(msg.data);
                } else if (msg.type === 'students_changed') {
	                    fetch('/api/students/list')
	                        .then(r => r.json())
	                        .then(d => { this.students = d.students || []; this.logs = this.logs.map(log => this.prepareLog(log)); })
	                        .catch(() => {});
	                } else if (msg.type === 'in_cars') {
	                    this.inCars = new Set(msg.data.cars);
	                } else if (msg.type === 'att_status') {
	                    this.attStatus[msg.data.key] = msg.data.status;
	                    this.attTimes[msg.data.key] = {
	                        in: msg.data.in_time || '',
	                        out: msg.data.out_time || '',
	                    };
	                } else if (msg.type === 'service_status') {
	                    this.serviceHealth = msg.data.health;
	                    this.lastRefresh = msg.data.last_refresh;
	                } else if (msg.type === 'refreshed') {
	                    this.refreshRemaining = msg.data.next_in || 0;
	                } else if (msg.type === 'att_reset') {
	                    this.attStatus = {};
	                    this.attTimes = {};
	                    // 로그 정렬 키가 "HH:MM:SS" 뿐이라 자정을 넘기면 새 로그가
	                    // 전날 항목보다 앞서 맨 위에 박힌다 — 날짜가 바뀌면 비운다
	                    this.resetLogs();
	                }
	            });
	            window.sseBus.start();
	        },

	        serviceLabel(service) {
	            if (!this.connected) return '연결 확인 중';
	            if (this.serviceHealth[service] === true) return '연결됨';
	            if (this.serviceHealth[service] === false) return '연결 실패';
	            return '확인 대기';
	        },

	        serviceTone(service) {
	            if (!this.connected) return '';
	            if (this.serviceHealth[service] === true) return 'online';
	            return this.serviceHealth[service] === false ? 'failed' : '';
	        },

	        isParked(student) {
	            for (const c of (student.car_no4s || [])) {
	                if (this.inCars.has(c)) return true;
	            }
	            return false;
	        },

	        keyOf(s) {
	            return (s.code || '').trim() || (s.name || '').trim();
	        },

            prepareLog(log) {
                const icon = this.logIcon(log);
                return { ...log, id: log.id || crypto.randomUUID(), icon,
                    iconIndex: ['입차', '출차', '등원', '하원', '성공', '실패'].indexOf(icon),
                    displayTarget: this.logTarget(log), displayType: this.logType(log) };
            },

            compareLogs(a, b) {
                const first = a.time || '', second = b.time || '';
                return first < second ? -1 : first > second ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
            },

            mergeLogs(entries) {
                const tab = this.logTabs.find(tab => tab.key === this.currentTab);
                const merged = new Map(this.logs.map(log => [log.id, log]));
                entries.forEach(entry => {
                    if (!tab || tab.match(entry)) {
                        const log = this.prepareLog(entry);
                        merged.set(log.id, log);
                    }
                });
                const sorted = [...merged.values()].sort((a, b) => this.compareLogs(a, b));
                if (sorted.length > this.logLimit) this.hasMoreLogs = true;
                this.logs = sorted.slice(-this.logLimit);
            },

            enqueueLog(log) {
                if (log.date && this.logsDate && log.date < this.logsDate) return;
                if (log.date && log.date !== this.logsDate) this.resetLogs(log.date);
                this.pendingLogs.push(log);
                if (this.logFrame !== null) return;
                this.logFrame = requestAnimationFrame(() => {
                    this.logFrame = null;
                    const follow = this.autoScroll;
                    this.mergeLogs(this.pendingLogs.splice(0));
                    if (follow) this.$nextTick(() => this.scrollToBottom(false));
                });
            },

            resetLogs(day = '') {
                this.logGeneration++;
                this.logs = [];
                this.pendingLogs = [];
                this.logsDate = day;
                this.logLimit = 500;
                this.hasMoreLogs = false;
                this.logsLoading = false;
                this.logsError = '';
            },

            selectLogTab(kind) {
                if (this.currentTab === kind) return;
                this.currentTab = kind;
                this.resetLogs(this.logsDate);
                this.loadLogs(false);
            },

            async loadLogs(more = false) {
                if (this.logsLoading) return;
                this.mergeLogs(this.pendingLogs.splice(0));
                const generation = this.logGeneration;
                const box = this.$refs.logBox;
                const height = box?.scrollHeight || 0, top = box?.scrollTop || 0;
                const query = new URLSearchParams({ kind: this.currentTab, day: this.logsDate });
                if (more && this.logs.length) query.set('before', JSON.stringify([this.logs[0].time, this.logs[0].id]));
                this.logsLoading = true;
                this.logsError = '';
                try {
                    const response = await fetch('/api/logs?' + query);
                    if (!response.ok) throw new Error();
                    const result = await response.json();
                    if (generation !== this.logGeneration) return;
                    if (this.logsDate && result.date !== this.logsDate) this.resetLogs(result.date);
                    this.logsDate = result.date;
                    if (more) this.logLimit += 500;
                    this.hasMoreLogs = result.has_more;
                    this.mergeLogs(result.logs);
                    this.mergeLogs(this.pendingLogs.splice(0));
                    this.logsLoading = false;
                    this.$nextTick(() => {
                        if (more && box) {
                            box.scrollTop = top + box.scrollHeight - height;
                            this.autoScroll = false;
                        } else this.scrollToBottom(true);
                    });
                } catch (error) {
                    if (generation === this.logGeneration) this.logsError = '기록을 불러오지 못했습니다. 다시 눌러 주세요.';
                } finally {
                    if (generation === this.logGeneration) this.logsLoading = false;
                }
            },

	        logIcon(log) {
	            if (!log.ok) return '실패';
	            if (log.type === '입차' || log.type === '출차') return log.type;
	            if (['안심톡', '안심톡(예약)', '등하원', '등하원(예약)'].includes(log.type)) {
	                const message = (log.message || '').replaceAll('등하원', '');
	                const states = ['등원', '하원'].filter(state => message.includes(state));
	                if (states.length === 1) return states[0];
	            }
	            return '성공';
	        },

	        logType(log) {
	            if (log.type === '차량등록') return '아이파킹';
	            if (log.type === '차량등록(예약)') return '아이파킹(예약)';
	            return log.type;
	        },

	        logTarget(log) {
	            const target = (log.target || '').trim();
	            if (!['안심톡', '안심톡(예약)', '등하원', '등하원(예약)', '차량등록', '차량등록(예약)'].includes(log.type)) {
	                return target || this.logType(log);
	            }
	            if (this.students.some(s => s.name === target)) return target;
	            const match = target.match(/^([0-9가-힣]*\d{4}(?:\s*,\s*[0-9가-힣]*\d{4})*)\s+(.+)$/);
	            if (!match) return target || this.logType(log);
	            if (log.type.endsWith('(예약)')) {
	                const identifiers = match[1].split(',').map(value => value.trim());
	                const names = [...new Set(this.students.filter(s => log.type.startsWith('차량등록')
	                    ? (s.car_no4s || []).some(car => identifiers.includes(car))
	                    : identifiers.includes(s.code)).map(s => s.name))];
	                if (names.length) return names.join(', ');
	            }
	            return match[2];
	        },

	        actionLabel(student, action) {
	            if (!this.actionsReady) return '연결 확인 중';
	            const pending = this.pendingActions[`${student.id}:${action}`];
	            if (pending === 'unknown') return '결과 확인 중';
	            if (pending === 'sending') return '요청 중…';
	            if (this.isBusy(student, action)) return '처리 중…';
	            return action === 'attendance' ? '등하원처리' : '주차권 등록';
	        },

	        statusOf(s) {
	            return this.attStatus[this.keyOf(s)] || '미등원';
	        },

	        badgeClass(st) {
	            if (st === '등원') return 'badge-in';
	            if (st === '하원') return 'badge-out';
	            if (st === '결석' || st === '공결' || st === '캠프') return 'badge-absent';
	            return 'badge-none';
	        },

	        inTimeOf(s) {
	            const t = this.attTimes[this.keyOf(s)];
	            return t ? (t.in || '').trim() : '';
	        },

	        outTimeOf(s) {
	            const t = this.attTimes[this.keyOf(s)];
	            return t ? (t.out || '').trim() : '';
	        },

	        // 카운트도 이름 검색을 함께 적용 — 목록 개수와 탭 숫자가 어긋나지 않도록
	        statusCount(st) {
	            const q = this.searchQuery.trim();
	            const pool = this.students.filter(s => nameMatches(s.name || '', q));
	            if (st === '전체') return pool.length;
	            return pool.filter(s => this.statusOf(s) === st).length;
	        },

	        get filteredStudents() {
	            const q = this.searchQuery.trim();
	            const out = [];
	            this.students.forEach((s) => {
	                if (!nameMatches(s.name || '', q)) return;
	                if (this.statusFilter !== '전체' && this.statusOf(s) !== this.statusFilter) return;
	                out.push({ ...s });
	            });
	            return out;
	        },

	        get studentGroups() {
	            const students = this.filteredStudents;
	            const groups = [];
	            for (let i = 0; i < Math.max(30, students.length); i += 15) {
	                groups.push({ index: i / 15, students: students.slice(i, i + 15) });
	            }
	            return groups;
	        },

	        get filteredLogs() {
	            const tab = this.logTabs.find(t => t.key === this.currentTab);
	            return tab ? this.logs.filter(tab.match) : this.logs;
	        },

	        scrollToBottom(force) {
	            const box = this.$refs.logBox;
	            if (!box) return;
	            box.scrollTop = box.scrollHeight;
	            if (force) this.autoScroll = true;
	        },

	        onLogScroll() {
	            const box = this.$refs.logBox;
	            if (!box) return;
	            const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 5;
	            this.autoScroll = atBottom;
	        },

	        async syncAtt() {
	            // 상태 필터 탭 클릭 시 등하원 상태만 즉시 갱신 — 최신 상태로 분류되도록.
	            // 연타해도 서버의 wake 이벤트가 진행 중 갱신 1회로 합쳐 준다.
	            try {
	                await fetch('/api/refresh?scope=att&if_stale=true', { method: 'POST' });
	            } catch (e) {}
	        },

	        async manualRefresh(ev) {
	            const btn = ev.currentTarget;
	            btn.disabled = true;
	            btn.classList.add('opacity-50');
	            this.refreshRemaining = 0;   // '…' 표시 — refreshed 이벤트가 오면 리셋됨
	            try {
	                await fetch('/api/refresh', { method: 'POST' });
	            } catch (e) {}
	            setTimeout(() => {
	                btn.disabled = false;
	                btn.classList.remove('opacity-50');
	            }, 800);
	        },

	        applyActions(snapshot) {
	            if (snapshot.instance === this.actionInstance && snapshot.revision < this.actionRevision) return;
	            this.actionInstance = snapshot.instance;
	            this.actionRevision = snapshot.revision;
	            this.actionResources = snapshot.resources;
	            this.actionsReady = true;
	        },

	        isBusy(student, action) {
	            if (!this.actionsReady || this.pendingActions[`${student.id}:${action}`]) return true;
	            const keys = [`${action}:student:${student.id}`];
	            if (action === 'attendance') {
	                keys.push(`attendance:code:${(student.code || '').trim()}`);
	            } else {
	                for (const car of student.car_no4s || []) keys.push(`vehicle:car:${car.trim().slice(-4)}`);
	            }
	            return keys.some(key => this.actionResources.includes(key));
	        },

	        async syncActions() {
	            if (this.actionsSyncing) return;
	            this.actionsSyncing = true;
	            const controller = new AbortController();
	            const timer = setTimeout(() => controller.abort(), 10000);
	            try {
	                const r = await fetch('/api/actions', { cache: 'no-store', signal: controller.signal });
	                if (!r.ok) throw new Error('작업 상태 조회 실패');
	                this.applyActions(await r.json());
	                for (const key of Object.keys(this.pendingActions)) {
	                    if (this.pendingActions[key] === 'unknown') delete this.pendingActions[key];
	                }
	            } catch {
	                // 연결이 끊겨도 완료 여부를 확인하기 전에는 잠금을 풀지 않는다.
	            } finally {
	                clearTimeout(timer);
	                this.actionsSyncing = false;
	            }
	        },

	        async doAction(sid, action) {
	            const student = this.students.find(s => s.id === sid);
	            if (!student || this.isBusy(student, action)) return;
	            const key = `${sid}:${action}`;
	            this.pendingActions[key] = 'sending';
	            this.actionError = '';
	            const controller = new AbortController();
	            const timer = setTimeout(() => controller.abort(), 15000);
	            try {
	                const r = await fetch(`/api/students/${sid}/${action}`, {
	                    method: 'POST', signal: controller.signal,
	                });
	                const result = await r.json();
	                if (result.actions) this.applyActions(result.actions);
	                if (!r.ok) this.actionError = result.error || '작업 요청 실패';
	                delete this.pendingActions[key];
	            } catch {
	                this.pendingActions[key] = 'unknown';
	                this.actionError = '서버 응답을 확인하지 못했습니다. 처리 상태를 다시 확인하고 있습니다.';
	                this.syncActions();
	            } finally {
	                clearTimeout(timer);
	            }
	        },
	    };
	}
</script>
{% endblock %}
